version: "3.8"

services:
  node1:
    build: .
    ports:
      - "9080:8080"
    environment:
      - NODE_NAME=node1
      - PEERS=node2:8080,node3:8080,node4:8080,node5:8080
    networks:
      - kvnet

  node2:
    build: .
    ports:
      - "9081:8080"
    environment:
      - NODE_NAME=node2
      - PEERS=node1:8080,node3:8080,node4:8080,node5:8080
    networks:
      - kvnet

  node3:
    build: .
    ports:
      - "9082:8080"
    environment:
      - NODE_NAME=node3
      - PEERS=node1:8080,node2:8080,node4:8080,node5:8080
    networks:
      - kvnet

  node4:
    build: .
    ports:
      - "9083:8080"
    environment:
      - NODE_NAME=node4
      - PEERS=node1:8080,node2:8080,node3:8080,node5:8080
    networks:
      - kvnet

  node5:
    build: .
    ports:
      - "9084:8080"
    environment:
      - NODE_NAME=node5
      - PEERS=node1:8080,node2:8080,node3:8080,node4:8080
    networks:
      - kvnet

networks:
  kvnet:
    driver: bridge
